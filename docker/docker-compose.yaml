services:
  dev:
    container_name: misaizu-dev
    image: ghcr.io/misaizu168/misaizu-image:1.6.0
    shm_size: "192g"
    volumes:
      - .:/sandbox
      - ./uv-cache:/uv-cache
    working_dir: /sandbox
    stdin_open: true
    tty: true
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]
    environment:
      - LANG=C.UTF-8
      - LC_ALL=C.UTF-8
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
